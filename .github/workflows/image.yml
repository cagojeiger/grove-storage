name: Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: grove-storage:ci
          cache-from: type=gha,scope=grove-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=grove-image-${{ matrix.arch }}
      - name: Verify runtime and file lifecycle
        run: python3 -B -u scripts/e2e-image.py grove-storage:ci
