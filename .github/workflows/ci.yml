name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  image-security:
    name: Image security / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build actual runtime image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: grove-security:${{ github.sha }}
          cache-from: type=gha,scope=grove-ci-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=grove-ci-${{ matrix.architecture }}
      - name: Smoke test non-root read-only runtime
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            "grove-security:$GITHUB_SHA" --help
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Test packaged console and API with a fresh database
        run: |
          npm --prefix frontend/web ci
          cd frontend/web && npx playwright install --with-deps chromium && cd ../..
          python3 -m venv /tmp/grove-image-sdk
          /tmp/grove-image-sdk/bin/pip install boto3==1.43.99
          /tmp/grove-image-sdk/bin/python -B scripts/e2e-image.py "grove-security:$GITHUB_SHA" \
            --report-dir "reports/trivy-ci-${{ matrix.architecture }}/runtime"
      - name: Preserve CI runtime evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-runtime-ci-${{ matrix.architecture }}
          path: reports/trivy-ci-${{ matrix.architecture }}/runtime/
          retention-days: 30
          if-no-files-found: error
      - uses: ./.github/actions/image-security
        with:
          image: grove-security:${{ github.sha }}
          architecture: ${{ matrix.architecture }}
          source: docker
          artifact: trivy-ci-${{ matrix.architecture }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm test

  object-policy:
    name: Object contracts (no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: python3 -B scripts/check-crate-boundaries.py
      - run: python3 -B -m unittest discover -s scripts/tests -p test_crate_boundaries.py -v
      - run: cargo test -p grove-management-policy --locked
      - run: cargo test -p grove-management-command --locked
      - run: cargo test -p grove-object-policy --locked
      - run: cargo test -p grove-object-service --locked
      - run: cargo test -p grove-s3-protocol --locked

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format
        run: cargo fmt --all --check

      - name: Diff check
        run: git diff --check

      - name: Release version and installer contracts
        run: |
          python3 deploy/ci/check-version.py
          python3 -B -m unittest discover -s deploy/tests -v

  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grove
          POSTGRES_PASSWORD: grove
          POSTGRES_DB: grove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U grove -d grove"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GROVE_DATABASE_URL: postgres://grove:grove@localhost:5432/grove
      # SQLx 테스트는 격리 DB에서 현재 baseline을 검증한다.
      DATABASE_URL: postgres://grove:grove@localhost:5432/grove

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: CLI API contract
        run: |
          cargo build --bin grove-storage --bin gscli --locked
          python3 -m venv /tmp/grove-s3-sdk
          /tmp/grove-s3-sdk/bin/pip install boto3==1.43.99
          /tmp/grove-s3-sdk/bin/python -B scripts/e2e-cli.py
          /tmp/grove-s3-sdk/bin/python -B scripts/e2e-mcp.py
          /tmp/grove-s3-sdk/bin/python -B scripts/e2e-shutdown.py

      - name: S3 SDK contract
        run: |
          /tmp/grove-s3-sdk/bin/python -B -m unittest discover -s scripts/tests -v
          /tmp/grove-s3-sdk/bin/python -B -u scripts/e2e-relay-upload.py --backend minio
          /tmp/grove-s3-sdk/bin/python -B -u scripts/e2e-s3.py --backend minio
          /tmp/grove-s3-sdk/bin/python -B -u scripts/e2e-s3-recovery.py
          /tmp/grove-s3-sdk/bin/python -B -u scripts/e2e-s3-recovery.py --restart
          /tmp/grove-s3-sdk/bin/python -B -u scripts/e2e-s3-recovery.py --db-failure

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Console real HTTPS API contract
        working-directory: frontend/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -B -u ../../scripts/e2e-console.py --auth-only
          /tmp/grove-s3-sdk/bin/python -B -u ../../scripts/e2e-console.py --with-minio

      - name: Swagger UI with Rust-generated public contracts
        working-directory: frontend/web
        run: |
          ../../target/debug/grove-storage openapi > /tmp/grove-openapi.json
          npm run build
          GROVE_TEST_OPENAPI=/tmp/grove-openapi.json npx playwright test tests/api-docs.spec.ts

  notegate:
    name: NoteGate file transfer contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Grove
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned NoteGate consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate
          ref: dab7fe552b3e6ac742465ea40ddd02b2253631fe
          path: .compat/notegate
          persist-credentials: false

      - name: Cache both Rust workspaces
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            .compat/notegate -> target

      - name: Build Grove
        run: cargo build --bin grove-storage --bin gscli --locked

      - name: Build NoteGate upload contracts
        working-directory: .compat/notegate
        run: |
          cargo test -p notegate-api rest::file_upload_tests:: --locked --no-run

      - name: Run actual NoteGate handlers against Grove and MinIO
        run: |
          python3 -m venv /tmp/grove-notegate-sdk
          /tmp/grove-notegate-sdk/bin/pip install boto3==1.43.99
          /tmp/grove-notegate-sdk/bin/python -B -u scripts/e2e-notegate.py --notegate-dir .compat/notegate

  installation:
    name: Fresh installation and backup restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Grove
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Build Grove
        run: cargo build --bin grove-storage --locked

      - name: Verify fresh installation and backup restore
        run: |
          python3 -m venv /tmp/grove-installation-sdk
          /tmp/grove-installation-sdk/bin/pip install boto3==1.43.99
          /tmp/grove-installation-sdk/bin/python -B -m unittest discover -s scripts/tests -v
          /tmp/grove-installation-sdk/bin/python -B -u scripts/e2e-installation.py

  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-audit

      # RUSTSEC-2023-0071 (rsa/Marvin): rsa는 sqlx-mysql 전용 전이 의존성이라
      # postgres-only인 이 워크스페이스 빌드엔 컴파일되지 않는다(cargo tree -i로 확인,
      # Cargo.lock에만 잔존). 상위 픽스 릴리스도 아직 없다 — 근거 있는 무시.
      - name: Audit
        run: cargo audit --deny unsound --ignore RUSTSEC-2023-0071
