name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  CI_RUN_ID: ${{ github.event.workflow_run.id }}
  CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

jobs:
  version:
    name: Resolve version
    if: >-
      github.repository == 'cagojeiger/grove-storage' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Resolve unpublished version
        id: ver
        run: |
          git fetch origin main --tags
          CURRENT_MAIN_SHA=$(git rev-parse origin/main) bash deploy/ci/resolve-release.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=grove-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=grove-release-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}

      - name: Resolve immutable candidate platform
        id: platform
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/index.json"
          digest=$(python3 deploy/ci/image-security.py platform "$RUNNER_TEMP/index.json" "$ARCHITECTURE")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test actual candidate
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          DIGEST: ${{ steps.platform.outputs.digest }}
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            "$IMAGE@$DIGEST" --help

      - name: Scan candidate before signing
        uses: ./.github/actions/image-security
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.platform.outputs.digest }}
          architecture: ${{ matrix.arch }}
          artifact: trivy-release-${{ matrix.arch }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Test packaged release console and API
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          DIGEST: ${{ steps.platform.outputs.digest }}
        run: |
          npm --prefix frontend/web ci
          cd frontend/web && npx playwright install --with-deps chromium && cd ../..
          python3 -m venv /tmp/grove-image-sdk
          /tmp/grove-image-sdk/bin/pip install boto3==1.43.99
          /tmp/grove-image-sdk/bin/python -B scripts/e2e-image.py "$IMAGE@$DIGEST" \
            --report-dir "reports/image-release-${{ matrix.arch }}"

      - name: Preserve release runtime evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-runtime-${{ matrix.arch }}
          path: reports/image-release-${{ matrix.arch }}/
          retention-days: 30
          if-no-files-found: error

      - name: Record source, workflow and successful CI
        run: python3 deploy/ci/release-evidence.py generate "$RUNNER_TEMP/release-evidence.json"

      - name: Sign scanned candidate evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          predicate-type: https://github.com/cagojeiger/grove-storage/attestations/release-evidence/v1
          predicate-path: ${{ runner.temp }}/release-evidence.json

      - name: Verify signed candidate evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://github.com/cagojeiger/grove-storage/attestations/release-evidence/v1 \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified-evidence.json"
          python3 deploy/ci/release-evidence.py verify "$RUNNER_TEMP/verified-evidence.json"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  cli:
    name: CLI ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build and verify native CLI
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release -p gscli --target "$TARGET"
          binary="target/$TARGET/release/gscli"
          test "$("$binary" --version)" = "gscli $VERSION"
          "$binary" --help
          GSCLI_TEST_BINARY="$PWD/$binary" cargo test -p gscli --locked --target "$TARGET" native_release_artifact -- --ignored
          GSCLI_TEST_BINARY="$PWD/$binary" python3 -B -m unittest discover -s deploy/tests -p test_installer.py -v
          mkdir -p /tmp/cli-assets
          asset="/tmp/cli-assets/gscli-$TARGET"
          cp "$binary" "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" | cut -d ' ' -f 1 > "$asset.sha256"
          else
            shasum -a 256 "$asset" | cut -d ' ' -f 1 > "$asset.sha256"
          fi

      - name: Upload CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.target }}
          path: /tmp/cli-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [version, build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Recheck release commit
        run: |
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          if git rev-parse --verify "refs/tags/${{ needs.version.outputs.tag }}" >/dev/null 2>&1; then
            echo '::error::Release tag appeared during the build; refusing to overwrite it'
            exit 1
          fi

      - name: Download CLI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/cli-assets
          pattern: cli-*
          merge-multiple: true

      - name: Assemble CLI manifest and installer
        run: |
          python3 deploy/cli/manifest.py /tmp/cli-assets "${{ needs.version.outputs.version }}" > /tmp/cli-assets/gscli-manifest.json
          cp deploy/cli/install.sh /tmp/cli-assets/gscli-installer.sh

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble candidate multi-platform release index
        id: index
        working-directory: /tmp/digests
        run: |
          images=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            images+=("${REGISTRY}/${IMAGE}@sha256:${digest}")
          done
          test "${#images[@]}" -eq 2
          candidate="${REGISTRY}/${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "$candidate" "${images[@]}"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record final index release evidence
        run: python3 deploy/ci/release-evidence.py generate "$RUNNER_TEMP/release-evidence.json"

      - name: Sign final index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          predicate-type: https://github.com/cagojeiger/grove-storage/attestations/release-evidence/v1
          predicate-path: ${{ runner.temp }}/release-evidence.json

      - name: Verify final index before promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://github.com/cagojeiger/grove-storage/attestations/release-evidence/v1 \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified-evidence.json"
          python3 deploy/ci/release-evidence.py verify "$RUNNER_TEMP/verified-evidence.json"

      - name: Promote verified digest without overwriting a version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo '::error::Release tag already exists'
            exit 1
          fi
          python3 deploy/ci/promote-image.py "$REGISTRY/$IMAGE" "$VERSION" "$DIGEST"

      - name: Inspect manifest
        run: |
          version="${{ needs.version.outputs.version }}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${version}"

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          gh release create "$tag" --target "$RELEASE_SHA" --title "$tag" \
            --generate-notes /tmp/cli-assets/*
