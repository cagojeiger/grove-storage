# 로컬 개발 환경: MinIO(직결 provider) + PostgreSQL(메타데이터 저장소).
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z # 마지막 AGPL 커뮤니티 릴리스 (docs/vendors/minio.md)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: grove
      MINIO_ROOT_PASSWORD: grove-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - minio-data:/data

  # 로컬 개발 버킷을 준비한다. Grove는 공급자 버킷을 생성하지 않는다.
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 grove grove-local-secret &&
      mc mb --ignore-existing local/grove-std
      "

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grove
      POSTGRES_PASSWORD: grove
      POSTGRES_DB: grove
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "grove", "-d", "grove"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - grove-pg-data:/var/lib/postgresql/data

volumes:
  minio-data:
  grove-pg-data:
