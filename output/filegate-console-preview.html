g-console .fg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#fg-console .fg-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--fg-line);border-radius:4px;background:var(--fg-bg);color:var(--fg-text);padding:8px 12px;min-height:36px}#fg-console .fg-primary{background:var(--fg-accent);color:light-dark(#fff,#25171b);border-color:var(--fg-accent)}#fg-console .fg-icon{width:36px;padding:8px}#fg-console .fg-link{border:0;background:transparent;padding:0;color:var(--fg-text);font-weight:500;text-align:left;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--fg-line)}#fg-console .fg-health{display:flex;flex-wrap:wrap;gap:20px;padding:0 0 24px;font-size:12px;color:var(--fg-sub)}#fg-console .fg-health strong{color:var(--fg-good);font-weight:500}#fg-console .fg-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 0 28px;border-bottom:1px solid var(--fg-line);gap:20px}#fg-console .fg-stat-value{font-size:26px;font-weight:500;margin-top:7px;font-variant-numeric:tabular-nums}#fg-console .fg-section{margin-top:28px}#fg-console .fg-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}#fg-console .fg-table-wrap{overflow-x:auto}#fg-console table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}#fg-console th{font-size:12px;color:var(--fg-sub);font-weight:400;padding:10px 10px;border-bottom:1px solid var(--fg-line);white-space:nowrap}#fg-console td{padding:var(--fg-row,16px) 10px;border-bottom:1px solid var(--fg-line);vertical-align:middle}#fg-console th:first-child,#fg-console td:first-child{padding-left:0}#fg-console th:last-child,#fg-console td:last-child{padding-right:0}#fg-console .fg-number{font-variant-numeric:tabular-nums;white-space:nowrap}#fg-console .fg-meter{width:120px;height:4px;margin-top:7px;background:var(--fg-line);border-radius:2px}#fg-console .fg-meter span{display:block;height:4px;background:var(--fg-accent);border-radius:2px}#fg-console .fg-status{font-size:12px;color:var(--fg-good);white-space:nowrap}#fg-console .fg-breadcrumb{color:var(--fg-sub);margin-bottom:12px;font-size:12px}#fg-console .fg-details{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;padding:22px 0;border-top:1px solid var(--fg-line);border-bottom:1px solid var(--fg-line)}#fg-console .fg-details dt{color:var(--fg-sub)}#fg-console .fg-details dd{margin:0;overflow-wrap:anywhere}#fg-console .fg-tabs{display:flex;gap:24px;border-bottom:1px solid var(--fg-line);margin-bottom:22px}#fg-console .fg-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 0;color:var(--fg-sub)}#fg-console .fg-tabs button[aria-selected=true]{color:var(--fg-accent);border-color:var(--fg-accent)}#fg-console .fg-alert{color:var(--fg-warning);border-left:3px solid var(--fg-warning);padding:10px 14px;background:var(--fg-soft);margin:18px 0;font-size:13px}#fg-console .fg-modal-layer{position:absolute;inset:0;background:#00000050;z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:80px 18px 22px}#fg-console .fg-modal{width:440px;max-width:100%;background:var(--fg-bg);border:1px solid var(--fg-line);border-radius:6px;padding:24px;box-shadow:0 16px 50px #00000030}#fg-console .fg-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}#fg-console label{display:block;font-size:13px;margin:16px 0 6px}#fg-console input,#fg-console select{width:100%;background:var(--fg-bg);border:1px solid var(--fg-line);color:var(--fg-text);border-radius:4px;padding:10px 12px;min-width:0}#fg-console .fg-modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}#fg-console .fg-form-error{color:var(--fg-accent);font-size:12px;margin-top:8px;min-height:18px}#fg-console .fg-login{min-height:658px;display:grid;place-items:center;padding:36px 24px}#fg-console .fg-login-inner{width:320px;max-width:100%}#fg-console .fg-login .fg-brand{margin-bottom:32px}#fg-console .fg-login h1{margin-bottom:6px}#fg-console .fg-login .fg-primary{width:100%;margin-top:22px}#fg-console .fg-login-footer{margin-top:28px;display:flex;justify-content:space-between;color:var(--fg-sub);font-size:12px}#fg-console .fg-notice{margin-top:18px;color:var(--fg-good);font-size:12px}#fg-console .fg-empty{padding:35px 0;color:var(--fg-sub);text-align:center}#fg-console .fg-connection{font-size:12px;color:var(--fg-sub)}

      #fg-console .fg-button{min-height:44px}#fg-console .fg-icon{width:44px}#fg-console .fg-modal-foot button{flex:1}#fg-console input,#fg-console select{font-size:16px}

    #fg-console .fg-check span{min-width:0}#fg-console .fg-storage-context{margin-top:10px;padding:12px 0;border-bottom:1px solid var(--fg-line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

  <div id="fg-view"></div>
  <div id="fg-overlay"></div>
  <script>
  (()=>{
    const root=document.getElementById('fg-console'),view=root.querySelector('#fg-view'),overlay=root.querySelector('#fg-overlay');
    const design={compact:false,accent:'rose'};
    let theme='system';
    const palettes={rose:['#b62549','#f58ea7'],forest:['#237357','#86d5b3'],graphite:['#56616e','#bdc6d3']};
    const clients=[{id:'notegate',storage:'r2-primary',files:152340,bytes:'800 GB',retained:12,keys:1,credentials:2},{id:'notegate-dev',storage:'r2-primary',files:4810,bytes:'20 GB',retained:0,keys:1,credentials:1},{id:'sandbox',storage:'oci-archive',files:0,bytes:'0 B',retained:0,keys:1,credentials:2}];
    const stores=[{id:'r2-primary',vendor:'Cloudflare R2',active:'820 GB',remaining:'168 GB',pct:83.2,files:'157,150'},{id:'oci-archive',vendor:'Oracle Object Storage',active:'380 GB',remaining:'612 GB',pct:38.8,files:'68,230'}];
    let page='overview',detail=null,tab='summary',notice='';
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
    const button=(text,action,cls='')=>`<button type="button" class="fg-button ${cls}" data-action="${action}">${text}</button>`;
    const refresh=()=>button(icon('refresh-cw'),'refresh','fg-icon');
    function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:page,client:detail,style:'minimal console',admin:'single superuser',theme},privateContent:{tab}}).catch(()=>{});}
    function themeControls(){return `<div class="fg-theme" role="group" aria-label="화면 모드">${[['system','monitor','시스템 설정'],['light','sun','라이트 모드'],['dark','moon','다크 모드']].map(([value,name,label])=>`<button type="button" data-theme="${value}" aria-label="${label}" data-tooltip="${label}" aria-pressed="${theme===value}">${icon(name)}</button>`).join('')}</div>`;}
    function applyTheme(){root.style.colorScheme=theme==='system'?'inherit':theme;root.dataset.theme=theme;const colors=palettes[design.accent];root.style.setProperty('--fg-accent',`light-dark(${colors[0]},${colors[1]})`);root.querySelectorAll('[data-theme]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.theme===theme)));}
    function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});root.querySelectorAll('[data-action=refresh]').forEach(e=>{e.setAttribute('aria-label','새로고침');e.setAttribute('data-tooltip','새로고침');});root.querySelectorAll('table').forEach(table=>{const labels=Array.from(table.querySelectorAll('th'),th=>th.textContent);table.querySelectorAll('tbody tr').forEach(row=>Array.from(row.children).forEach((cell,i)=>cell.dataset.label=labels[i]||''));});}
    function storageTable(){return `<div class="fg-table-wrap"><table><thead><tr><th>이름</th><th>사용량 / 등록 한도</th><th>잔여</th><th>전송</th></tr></thead><tbody>${stores.map(s=>`<tr><td><button class="fg-link" data-storage="${s.id}">${s.id}</button><div class="fg-muted">${s.vendor}</div></td><td class="fg-number">${s.active} / 1 TB<div class="fg-meter"><span style="width:${s.pct}%"></span></div></td><td class="fg-number">${s.remaining}</td><td class="fg-muted">Presigned</td></tr>`).join('')}</tbody></table></div>`;}
    function clientTable(){return `<div class="fg-table-wrap"><table><thead><tr><th>클라이언트</th><th>스토리지</th><th>활성 파일</th><th>사용량</th></tr></thead><tbody>${clients.map(c=>`<tr><td><button class="fg-link" data-client="${esc(c.id)}">${esc(c.id)}</button></td><td>${c.storage}</td><td class="fg-number">${c.files.toLocaleString()}</td><td class="fg-number">${c.bytes}</td></tr>`).join('')}</tbody></table></div>`;}
    function main(){
      if(page==='overview')return `<div class="fg-heading"><h1>Overview</h1>${refresh()}</div><div class="fg-health"><span>API <strong>Ready</strong></span><span>Database <strong>Ready</strong></span><span>스토리지 접근 · 미검사</span></div><div class="fg-stats"><div><p class="fg-muted">활성 사용량</p><div class="fg-stat-value">1.20 TB</div></div><div><p class="fg-muted">등록 한도</p><div class="fg-stat-value">2.00 TB</div></div><div><p class="fg-muted">잔여 용량</p><div class="fg-stat-value">780 GB</div></div></div><div class="fg-section"><div class="fg-section-head"><h2>Storages</h2><span class="fg-muted">예약 8 GB · 삭제 대기 12 GB</span></div>${storageTable()}</div><div class="fg-section"><div class="fg-section-head"><h2>Clients</h2><button class="fg-link" data-page="clients">전체 보기 →</button></div>${clientTable()}</div>`;
      if(page==='storages'&&detail){const s=stores.find(x=>x.id===detail);return `<div class="fg-breadcrumb"><button class="fg-link" data-page="storages">Storages</button> / ${s.id}</div><div class="fg-heading"><h1>${s.id}</h1>${refresh()}</div><dl class="fg-details"><dt>Provider</dt><dd>${s.vendor}</dd><dt>전송 방식</dt><dd>Direct presigned</dd><dt>사용량 / 한도</dt><dd>${s.active} / 1 TB</dd><dt>잔여 용량</dt><dd>${s.remaining}</dd><dt>접근 상태</dt><dd>미검사</dd><dt>Secret key</dt><dd>설정됨</dd></dl><div class="fg-section"><h2>연결된 클라이언트</h2><div class="fg-section">${clients.filter(c=>c.storage===s.id).map(c=>`<p><button class="fg-link" data-client="${esc(c.id)}">${esc(c.id)}</button></p>`).join('')||'<p class="fg-muted">연결된 클라이언트 없음</p>'}</div></div>`;}
      if(page==='storages')return `<div class="fg-heading"><h1>Storages <span class="fg-muted">2</span></h1>${refresh()}</div>${storageTable()}<p class="fg-muted" style="margin-top:16px">FileGate 등록 한도 기준</p>`;
      if(page==='clients'&&detail){const c=clients.find(x=>x.id===detail);return `<div class="fg-breadcrumb"><button class="fg-link" data-page="clients">Clients</button> / ${esc(c.id)}</div><div class="fg-heading"><h1>${esc(c.id)}</h1>${button(icon('trash-2')+' 삭제','delete')}</div><div class="fg-tabs" role="tablist" aria-label="클라이언트 상세">${[['summary','Summary'],['keys','Native keys'],['credentials','S3 credentials']].map(([id,label])=>`<button role="tab" aria-selected="${tab===id}" data-tab="${id}">${label}</button>`).join('')}</div>${tab==='summary'?`<dl class="fg-details"><dt>스토리지</dt><dd>${c.storage}</dd><dt>활성 파일</dt><dd>${c.files.toLocaleString()}</dd><dt>사용량</dt><dd>${c.bytes}</dd><dt>보존 메타데이터</dt><dd>${c.retained}</dd></dl>`:`<div class="fg-table-wrap"><table><thead><tr><th>${tab==='keys'?'Key hash':'Access key ID'}</th><th>소유자</th></tr></thead><tbody>${Array.from({length:tab==='keys'?c.keys:c.credentials},(_,i)=>`<tr><td>${tab==='keys'?'sha256:4e91…82a'+i:'example'+(i+1)+'accesskey'}</td><td>${esc(c.id)}</td></tr>`).join('')}</tbody></table>${(tab==='keys'?c.keys:c.credentials)===0?'<p class="fg-empty">등록된 키 없음</p>':''}</div>`}`;}
      return `<div class="fg-heading"><h1>Clients <span class="fg-muted">${clients.length}</span></h1><div class="fg-actions">${refresh()}${button(icon('plus')+' 클라이언트 등록','create','fg-primary')}</div></div>${clientTable()}${clients.length===0?'<p class="fg-empty">등록된 클라이언트 없음</p>':''}`;
    }
    function render(){
      overlay.innerHTML='';root.style.setProperty('--fg-row',design.compact?'10px':'16px');
      if(page==='login')view.innerHTML=`<div class="fg-login"><div class="fg-login-inner"><div class="fg-brand">${icon('hard-drive')} FileGate</div><h1>관리자 로그인</h1><p class="fg-muted">Home · Production</p><form id="fg-login-form"><label for="fg-admin-token">관리자 토큰</label><input id="fg-admin-token" type="password" placeholder="fgop_..." required autocomplete="off" spellcheck="false" autocapitalize="none"><button class="fg-button fg-primary" type="submit">로그인</button></form><div class="fg-login-footer"><span>단일 관리자</span><span>v0.4.1</span></div><div class="fg-muted" style="margin-top:12px">미리보기 · 테스트용 값만 입력하세요</div></div></div>`;
      else view.innerHTML=`<header class="fg-top"><div class="fg-brand">${icon('hard-drive')} FileGate</div><div class="fg-top-right"><span class="fg-connection"><span class="fg-dot"></span>Home / Production</span><span class="fg-muted">admin</span><button class="fg-button fg-icon" aria-label="로그아웃" data-tooltip="로그아웃" data-action="logout">${icon('log-out')}</button></div></header><div class="fg-layout"><nav class="fg-nav" aria-label="메인 메뉴">${[['overview','layout-dashboard','Overview'],['storages','database','Storages'],['clients','boxes','Clients']].map(([p,i,label])=>`<button data-page="${p}" ${page===p?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('')}<div class="fg-nav-footer">v0.4.1<br>미리보기 · 예시 데이터</div></nav><main class="fg-main">${main()}<div class="fg-notice" role="status">${esc(notice)}</div></main></div>`;
      const top=view.querySelector('.fg-top-right');if(top)top.insertAdjacentHTML('afterbegin',themeControls());
      const login=view.querySelector('.fg-login-inner');if(login)login.insertAdjacentHTML('afterbegin',`<div class="fg-login-theme">${themeControls()}</div>`);
      if(page==='clients'&&detail&&tab==='keys'){const entry=clients.find(c=>c.id===detail),cell=view.querySelector('tbody td');if(entry?.nativeHash&&cell)cell.textContent=entry.nativeHash;}
      applyTheme();icons();
      const form=root.querySelector('#fg-login-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();form.reset();page='overview';detail=null;notice='';render();save();});
    }
    root.addEventListener('click',e=>{const submit=e.target.closest('button[type="submit"]');if(submit?.form){e.preventDefault();if(submit.form.reportValidity())submit.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
    root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target instanceof HTMLInputElement&&e.target.form){e.preventDefault();if(e.target.form.reportValidity())e.target.form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
    root.addEventListener('click',e=>{const control=e.target.closest('button[data-theme]');if(control){theme=control.dataset.theme;applyTheme();save();}});
    let previousFocus=null;
    const modalSize=new ResizeObserver(()=>{const dialog=overlay.querySelector('.fg-modal');root.style.minHeight=dialog?`${Math.max(660,dialog.offsetHeight+(innerWidth<=767?40:110))}px`:'';});modalSize.observe(overlay);
    function close(){overlay.innerHTML='';root.style.minHeight='';previousFocus?.focus();}
    function modal(title,body,foot){previousFocus=document.activeElement;overlay.innerHTML=`<div class="fg-modal-layer"><section class="fg-modal" role="dialog" aria-modal="true" aria-labelledby="fg-modal-title"><div class="fg-modal-head"><h2 id="fg-modal-title">${title}</h2><button class="fg-button fg-icon" data-action="close" aria-label="닫기">${icon('x')}</button></div>${body}<div class="fg-modal-foot">${foot}</div></section></div>`;icons();overlay.querySelector('input,button')?.focus();}
    function fitModal(){const dialog=overlay.querySelector('.fg-modal');if(dialog)root.style.minHeight=`${Math.max(660,dialog.offsetHeight+(innerWidth<=767?40:110))}px`;}
    function create(){
      modal('클라이언트 등록',`<p class="fg-muted">Home / Production</p>
        <form id="fg-create-form">
          <label for="fg-id">클라이언트 ID</label><input id="fg-id" placeholder="my-service" maxlength="64" required>
          <label for="fg-store">연결 스토리지</label><select id="fg-store">${stores.map(s=>`<option value="${s.id}">${s.id}</option>`).join('')}</select>
          <div id="fg-storage-context" class="fg-storage-context fg-muted"></div>
          <div class="fg-form-section"><h3>초기 자격증명 <span class="fg-muted">선택 사항</span></h3>
            <label class="fg-check"><input id="fg-issue-s3" type="checkbox"><span>S3 자격증명 함께 발급</span></label>
            <label class="fg-check"><input id="fg-register-native" type="checkbox"><span>기존 Native 키 해시 등록</span></label>
            <div id="fg-native-field" class="fg-native-field" hidden><label for="fg-native-hash">SHA-256 키 해시</label><input id="fg-native-hash" placeholder="sha256:…" autocomplete="off" spellcheck="false"></div>
          </div>
          <div id="fg-error" class="fg-form-error" role="alert"></div>
        </form>`,button('취소','close')+'<button class="fg-button fg-primary" form="fg-create-form" type="submit">등록</button>');
      const form=root.querySelector('#fg-create-form'),storeSelect=root.querySelector('#fg-store'),native=root.querySelector('#fg-register-native'),hashInput=root.querySelector('#fg-native-hash');
      function storageInfo(){const s=stores.find(s=>s.id===storeSelect.value);root.querySelector('#fg-storage-context').innerHTML=`<span>${s.vendor}</span><span>잔여 ${s.remaining} · Presigned</span>`;fitModal();}
      storeSelect.addEventListener('change',storageInfo);storageInfo();
      native.addEventListener('change',()=>{root.querySelector('#fg-native-field').hidden=!native.checked;hashInput.required=native.checked;if(native.checked)hashInput.focus();fitModal();});
      form.addEventListener('submit',e=>{
        e.preventDefault();const id=root.querySelector('#fg-id').value.trim(),error=root.querySelector('#fg-error'),hash=hashInput.value.trim(),s3=root.querySelector('#fg-issue-s3').checked;
        if(!/^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$/.test(id)){error.textContent='소문자, 숫자, 하이픈으로 입력하세요.';fitModal();return;}
        if(['api','blobs','healthz','readyz'].includes(id)||clients.some(c=>c.id===id)){error.textContent='이미 사용 중이거나 예약된 이름입니다.';fitModal();return;}
        if(native.checked&&!/^sha256:[0-9a-f]{64}$/.test(hash)){error.textContent='sha256: 뒤에 소문자 16진수 64자리를 입력하세요.';fitModal();return;}
        if(native.checked&&clients.some(c=>c.nativeHash===hash)){error.textContent='이미 등록된 Native 키 해시입니다.';fitModal();return;}
        const entry={id,storage:storeSelect.value,files:0,bytes:'0 B',retained:0,keys:native.checked?1:0,credentials:s3?1:0,nativeHash:native.checked?hash:null};
        clients.push(entry);detail=id;tab='summary';notice='클라이언트를 등록했습니다.';render();save();
        if(entry.keys||entry.credentials){modal('등록 결과',`<p>${esc(id)}</p><dl class="fg-details"><dt>클라이언트</dt><dd>등록 완료</dd><dt>Native 키</dt><dd>${entry.keys?'등록 완료':'선택 안 함'}</dd><dt>S3 자격증명</dt><dd>${s3?'발급 완료':'선택 안 함'}</dd></dl>${s3?'<p class="fg-muted">미리보기용 자격증명 · 실제 인증에 사용할 수 없음</p><label>Access key ID</label><code class="fg-secret-value">example1accesskey</code><label>Secret key · 이번 화면에서만 표시</label><code class="fg-secret-value">demo-only-not-a-real-secret</code>':''}`,button('확인','close','fg-primary'));fitModal();}
      });
    }
    function remove(){const c=clients.find(x=>x.id===detail),blocked=c.files+c.retained>0;modal('클라이언트 삭제',`<p>${esc(c.id)} <span class="fg-muted">· Home / Production</span></p><dl class="fg-details"><dt>남은 파일</dt><dd>${c.files.toLocaleString()}</dd><dt>보존 메타데이터</dt><dd>${c.retained}</dd><dt>Native keys</dt><dd>${c.keys}개 함께 폐기</dd><dt>S3 credentials</dt><dd>${c.credentials}개 함께 폐기</dd></dl>${blocked?'<div class="fg-alert">파일 또는 보존 중인 메타데이터가 남아 있어 삭제할 수 없습니다.</div>':`<label for="fg-confirm">확인을 위해 ${esc(c.id)} 입력</label><input id="fg-confirm" autocomplete="off">`}`,button('취소','close')+'<button class="fg-button fg-primary" id="fg-delete-confirm" disabled>삭제</button>');const input=root.querySelector('#fg-confirm');if(input)input.addEventListener('input',()=>{root.querySelector('#fg-delete-confirm').disabled=input.value!==c.id;});root.querySelector('#fg-delete-confirm').addEventListener('click',()=>{if(blocked||input.value!==c.id)return;clients.splice(clients.indexOf(c),1);detail=null;notice=`${c.id} 및 소유 키를 삭제했습니다.`;render();save();});}
    root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.page){page=el.dataset.page;detail=null;tab='summary';notice='';render();save();}else if(el.dataset.client){page='clients';detail=el.dataset.client;tab='summary';notice='';render();save();}else if(el.dataset.storage){page='storages';detail=el.dataset.storage;notice='';render();save();}else if(el.dataset.tab){tab=el.dataset.tab;render();save();}else if(el.dataset.action==='logout'){page='login';detail=null;notice='';render();save();}else if(el.dataset.action==='refresh'){notice='방금 새로고침';render();}else if(el.dataset.action==='create')create();else if(el.dataset.action==='delete')remove();else if(el.dataset.action==='close')close();});
    root.addEventListener('keydown',e=>{if(!overlay.firstElementChild)return;if(e.key==='Escape'){close();return;}if(e.key==='Tab'){const items=Array.from(overlay.querySelectorAll('button:not(:disabled),input,select'));const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
    function restore(s){const m=s?.modelContent,p=s?.privateContent;if(['system','light','dark'].includes(m?.theme))theme=m.theme;if(m&&['overview','storages','clients','login'].includes(m.screen)){page=m.screen;detail=page==='clients'&&clients.some(c=>c.id===m.client)?m.client:page==='storages'&&stores.some(c=>c.id===m.client)?m.client:null;tab=['summary','keys','credentials'].includes(p?.tab)?p.tab:'summary';}render();}
    restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'compact',{label:'촘촘한 표'});tweak.addSelect(design,'accent',{label:'강조 색상',options:[{label:'Rose',value:'rose'},{label:'Forest',value:'forest'},{label:'Graphite',value:'graphite'}]});}
  })();
  </script>
</div>
