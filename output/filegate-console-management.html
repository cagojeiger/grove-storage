<div id="fg-management" aria-label="FileGate management console">
<style>
#fg-management{--bg:light-dark(#fff,#191b1f);--soft:light-dark(#f6f7f9,#22252a);--fg:light-dark(#252a31,#edf0f3);--muted:light-dark(#69717d,#b0b6c0);--line:light-dark(#e0e4e9,#383e46);--accent:light-dark(#b62549,#f58ea7);--selected:light-dark(#f9eaf0,#3a2831);--good:light-dark(#227758,#80d5b2);--warn:light-dark(#98631b,#efc07b);--danger:light-dark(#bf3544,#ff8a96);--row:16px;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;letter-spacing:0;min-height:720px;position:relative;color-scheme:light dark}
#fg-management *{box-sizing:border-box}#fg-management button,#fg-management input,#fg-management select,#fg-management textarea{font:inherit;letter-spacing:0}#fg-management button{color:inherit}#fg-management button:disabled{opacity:.45;cursor:not-allowed}#fg-management button:focus-visible,#fg-management input:focus-visible,#fg-management select:focus-visible,#fg-management summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#fg-management h1{font-size:23px;font-weight:500;margin:0}#fg-management h2{font-size:16px;font-weight:500;margin:0}#fg-management h3{font-size:14px;font-weight:500;margin:0}#fg-management p{margin:0}#fg-management small,.gm-muted{font-size:12px;color:var(--muted)}#fg-management svg{width:16px;height:16px;flex-shrink:0}#fg-management .gm-top{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#fg-management .gm-brand{font-size:18px;font-weight:500;display:flex;gap:9px;align-items:center}#fg-management .gm-brand svg{color:var(--accent);width:22px;height:22px}#fg-management .gm-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#fg-management .gm-layout{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:650px}#fg-management nav{background:var(--soft);border-right:1px solid var(--line);padding:20px 10px;display:flex;flex-direction:column;gap:5px}#fg-management nav button{display:flex;gap:9px;align-items:center;padding:9px 12px;background:transparent;border:0;border-radius:4px;text-align:left;color:var(--muted)}#fg-management nav button[aria-current=page]{background:var(--selected);color:var(--accent);box-shadow:inset 2px 0 var(--accent)}#fg-management .gm-foot{margin-top:auto;padding:70px 12px 0;font-size:12px;color:var(--muted)}#fg-management main{padding:28px;min-width:0}#fg-management .gm-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}#fg-management .gm-subtitle{color:var(--muted);font-size:12px;margin-top:5px}#fg-management .gm-btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;padding:6px 11px;min-height:32px;background:var(--bg);border:1px solid var(--line);border-radius:5px;white-space:normal}#fg-management .gm-primary{background:var(--accent);border-color:var(--accent);color:light-dark(#fff,#29191e)}#fg-management .gm-danger{color:var(--danger);border-color:var(--danger)}#fg-management .gm-icon{padding:7px;width:32px;flex-shrink:0}#fg-management .gm-link{background:none;border:0;padding:0;color:var(--accent);text-align:left;overflow-wrap:anywhere}#fg-management .gm-theme{display:flex;gap:2px}#fg-management .gm-theme button{background:transparent;border:0;border-radius:4px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}#fg-management .gm-theme button[aria-pressed=true]{background:var(--soft);color:var(--accent)}#fg-management .gm-section{margin-top:28px}#fg-management .gm-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}#fg-management .gm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:18px 0 24px;border-bottom:1px solid var(--line)}#fg-management .gm-value{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:4px}#fg-management .gm-status{color:var(--good);display:inline-flex;align-items:center;gap:5px;font-size:12px}#fg-management table{width:100%;border-collapse:collapse;text-align:left}#fg-management th{font-size:12px;color:var(--muted);font-weight:400;padding:10px 8px;border-bottom:1px solid var(--line)}#fg-management td{padding:var(--row) 8px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}#fg-management td:first-child,#fg-management th:first-child{padding-left:0}#fg-management td:last-child,#fg-management th:last-child{padding-right:0}#fg-management .gm-num{font-variant-numeric:tabular-nums}#fg-management .gm-meter{width:100%;max-width:150px;height:4px;background:var(--line);margin-top:8px}#fg-management .gm-meter span{display:block;height:100%;background:var(--accent)}#fg-management .gm-crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px;overflow-wrap:anywhere}#fg-management .gm-details{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;border-block:1px solid var(--line);padding:20px 0}#fg-management dt{color:var(--muted)}#fg-management dd{margin:0;overflow-wrap:anywhere}#fg-management .gm-alert{border-left:3px solid var(--warn);background:var(--soft);padding:12px 16px;margin:20px 0;color:var(--warn)}#fg-management .gm-alert p{margin-top:6px;font-size:13px}#fg-management .gm-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}#fg-management .gm-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 0;color:var(--muted)}#fg-management .gm-tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}#fg-management .gm-form{max-width:760px}#fg-management .gm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}#fg-management .gm-field{display:flex;flex-direction:column;gap:6px;min-width:0}#fg-management label{font-size:13px}#fg-management input,#fg-management select,#fg-management textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--bg);color:var(--fg)}#fg-management input:read-only{background:var(--soft);color:var(--muted)}#fg-management .gm-wide{grid-column:1/-1}#fg-management .gm-form-section{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}#fg-management .gm-form-section h2{margin-bottom:16px}#fg-management .gm-check{display:flex;gap:9px;align-items:flex-start;margin:12px 0}#fg-management .gm-check input{width:17px;height:17px;margin:2px 0;accent-color:var(--accent);flex-shrink:0}#fg-management details{border-block:1px solid var(--line);padding:16px 0;margin-top:24px}#fg-management details .gm-grid{margin-top:18px}#fg-management summary{font-size:13px;color:var(--muted)}#fg-management .gm-form-foot{margin-top:24px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}#fg-management .gm-error{color:var(--danger);margin-top:14px;font-size:13px}#fg-management .gm-notice{color:var(--good);font-size:13px;margin-bottom:18px}#fg-management .gm-empty{padding:28px 0;text-align:center;color:var(--muted)}#fg-management .gm-modal-layer{position:absolute;inset:0;z-index:5;background:#0006;display:flex;justify-content:center;align-items:flex-start;padding:70px 20px 24px}#fg-management .gm-modal{width:460px;max-width:100%;background:var(--bg);padding:24px;border:1px solid var(--line);border-radius:6px}#fg-management .gm-modal .gm-heading{margin-bottom:18px}#fg-management .gm-modal p{margin-bottom:18px}#fg-management .gm-code{padding:12px;background:var(--soft);border:1px solid var(--line);font-family:ui-monospace,monospace;overflow-wrap:anywhere;font-size:12px;margin:8px 0 16px}#fg-management .gm-history{display:flex;align-items:flex-end;height:120px;gap:12px;border-bottom:1px solid var(--line);padding-top:12px}#fg-management .gm-bar{flex:1;min-width:0;background:var(--soft);position:relative;height:100%;display:flex;align-items:flex-end}#fg-management .gm-bar span{display:block;width:100%;background:var(--accent);opacity:.65}#fg-management .gm-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}#fg-management .gm-login{max-width:340px;margin:70px auto;padding:24px}#fg-management .gm-login h1{margin:24px 0}#fg-management .gm-login .gm-primary{width:100%;margin-top:20px}#fg-management [hidden]{display:none!important}
@media(max-width:767px){#fg-management .gm-layout{grid-template-columns:1fr}#fg-management nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px}#fg-management nav button{flex:1;justify-content:center;padding:10px 4px;font-size:12px}#fg-management .gm-foot{display:none}#fg-management main{padding:22px 16px}#fg-management .gm-top{padding:12px 16px;gap:8px}#fg-management .gm-environment{display:none}#fg-management .gm-grid{grid-template-columns:1fr}#fg-management .gm-stats{grid-template-columns:1fr 1fr}#fg-management .gm-stats>div:first-child{grid-column:1/-1}#fg-management .gm-details{grid-template-columns:95px minmax(0,1fr);font-size:13px}#fg-management table,#fg-management tbody{display:block}#fg-management thead{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden}#fg-management tr{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}#fg-management td,#fg-management td:first-child,#fg-management td:last-child{display:block;padding:0;border:0;min-width:0}#fg-management td:first-child{grid-column:1/-1}#fg-management td::before{content:attr(data-label);display:block;font-size:12px;color:var(--muted);margin-bottom:4px}#fg-management .gm-btn{min-height:44px}#fg-management .gm-icon{width:44px}#fg-management .gm-theme button{height:44px;width:32px}#fg-management input,#fg-management select,#fg-management textarea{font-size:16px}#fg-management .gm-modal-layer{padding:20px 10px}#fg-management .gm-modal{padding:20px 16px}#fg-management .gm-tabs{gap:14px}#fg-management .gm-heading{gap:12px}#fg-management h1{overflow-wrap:anywhere;max-width:100%}}
@media(pointer:coarse){#fg-management button{min-height:44px}#fg-management input,#fg-management select{font-size:16px}}
</style>
<div id="gm-view"></div><div id="gm-overlay"></div>
<script>
(()=>{
 const root=document.getElementById('fg-management'),view=root.querySelector('#gm-view'),overlay=root.querySelector('#gm-overlay');
 const stores=[{id:'r2-primary',endpoint:'https://example.r2.cloudflarestorage.com',bucket:'filegate-prod',region:'auto',access:'example-access-key',capacity:1000,active:820,pending:8,purge:12,files:157150,path:false,relay:false},{id:'s3-archive',endpoint:'https://s3.example.com',bucket:'archive',region:'us-east-1',access:'example-archive-key',capacity:1000,active:380,pending:0,purge:0,files:68230,path:true,relay:false},{id:'s3-sandbox',endpoint:'https://s3.example.com',bucket:'sandbox',region:'us-east-1',access:'example-sandbox-key',capacity:100,active:0,pending:0,purge:0,files:0,path:true,relay:false}];
 const clients=[{id:'notegate',storage:'r2-primary',files:152340,active:800,retained:12,keys:['sha256:'+ 'a'.repeat(64)],creds:['fgak_example_notegate']},{id:'notegate-dev',storage:'r2-primary',files:4810,active:20,retained:0,keys:[],creds:['fgak_example_dev']},{id:'archive-worker',storage:'s3-archive',files:68230,active:380,retained:0,keys:[],creds:['fgak_example_archive']},{id:'sandbox',storage:'s3-sandbox',files:0,active:0,retained:0,keys:[],creds:[]}];
 let page='storages',id=null,tab='summary',mode=null,theme='system',notice='',serial=0,secret=null,period='7',generation=0;
 const design={dense:false};
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const icon=x=>`<i data-lucide="${x}" aria-hidden="true"></i>`;
 const btn=(label,action,style='',extra='')=>`<button type="button" class="gm-btn cursor-interaction ${style}" data-action="${action}" ${extra}>${label}</button>`;
 const link=(label,kind,key)=>`<button class="gm-link cursor-interaction" data-open="${kind}" data-id="${esc(key)}">${esc(label)}</button>`;
 const money=x=>`${x.toLocaleString()} GB`;
 const count=x=>Number(x).toLocaleString();
 const total=key=>stores.reduce((n,s)=>n+s[key],0);
 const field=(label,name,value='',type='text',extra='')=>`<div class="gm-field"><label for="gm-${name}">${label}</label><input id="gm-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
 const check=(label,name,value=false)=>`<label class="gm-check"><input type="checkbox" name="${name}" ${value?'checked':''}><span>${label}</span></label>`;
 const heading=(title,subtitle,actions='')=>`<div class="gm-heading"><div><h1>${esc(title)}</h1><p class="gm-subtitle">${esc(subtitle)}</p></div><div class="gm-actions">${actions}</div></div>`;
 const refresh=()=>btn(icon('refresh-cw'),'refresh','gm-icon','aria-label="새로고침" data-tooltip="새로고침"');
 const themes=()=>`<div class="gm-theme" role="group" aria-label="화면 모드">${[['system','monitor','시스템'],['light','sun','라이트'],['dark','moon','다크']].map(([v,i,l])=>`<button class="cursor-interaction" data-theme="${v}" aria-label="${l} 모드" data-tooltip="${l} 모드" aria-pressed="${theme===v}">${icon(i)}</button>`).join('')}</div>`;
 function save(){window.openai?.setWidgetState?.({modelContent:{screen:page,theme},privateContent:{id,tab,period}}).catch(()=>{});}
 function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td data-label="${esc(headers[i])}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length?'':'<p class="gm-empty">등록된 항목 없음</p>'}`;}
 function storageTable(){return table(['스토리지 / 버킷','사용량 / 한도','클라이언트','전송'],stores.map(s=>[`${link(s.id,'storages',s.id)}<div class="gm-muted">${esc(s.bucket)}</div>`,`<span class="gm-num">${money(s.active)} / ${s.capacity?money(s.capacity):'무제한'}</span><div class="gm-meter"><span style="width:${s.capacity?Math.min(100,100*s.active/s.capacity):0}%"></span></div>`,count(clients.filter(c=>c.storage===s.id).length),s.relay?'Relay':'Presigned']));}
 function clientTable(rows=clients){return table(['클라이언트','스토리지','파일','사용량'],rows.map(c=>[link(c.id,'clients',c.id),link(c.storage,'storages',c.storage),count(c.files),money(c.active)]));}
 function detailList(pairs){return `<dl class="gm-details">${pairs.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;}
 function reasons(){if(page==='storages'){const s=stores.find(s=>s.id===id);return [s.files?`파일 ${count(s.files)}개`:null,s.pending?`업로드 예약 ${money(s.pending)}`:null,s.purge?`물리 삭제 대기 ${money(s.purge)}`:null,clients.some(c=>c.storage===id)?`연결된 클라이언트 ${clients.filter(c=>c.storage===id).length}개`:null].filter(Boolean);}const c=clients.find(c=>c.id===id);return [c.files?`파일 ${count(c.files)}개`:null,c.retained?`보존 메타데이터 ${c.retained}개`:null].filter(Boolean);}
 function deletion(){const blocked=reasons();return `<section class="gm-section"><div class="gm-section-head"><h2>등록 삭제</h2>${btn(icon('trash-2')+' 삭제','delete','gm-danger',blocked.length?'disabled aria-describedby="gm-blocked"':'')}</div>${blocked.length?`<div class="gm-alert" id="gm-blocked"><strong>삭제 보호 중</strong><p>${blocked.map(esc).join(' · ')}</p></div>`:'<p class="gm-muted">참조 없음 · 이름 확인 후 삭제 가능</p>'}</section>`;}
 function storageForm(){const s=id?stores.find(s=>s.id===id):{};return heading(id?'스토리지 수정':'S3 스토리지 등록',id||'기존 버킷 연결')+`<form id="gm-form" class="gm-form" data-kind="storage"><div class="gm-grid">${field('스토리지 ID','id',s.id||'','text',`required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" ${id?'readonly':''}`)}${field('등록 한도 (GB, 0 = 무제한)','capacity',s.capacity??1000,'number','required min="0" step="1"')}</div><section class="gm-form-section"><h2>연결 정보</h2><div class="gm-grid">${field('S3 Endpoint','endpoint',s.endpoint||'','url','required placeholder="https://s3.example.com"')}${field('Region','region',s.region||'auto','text','required')}${field('Bucket','bucket',s.bucket||'','text','required')}${field('Access Key','access',s.access||'','text','required autocomplete="off"')}${field(id?'Secret Key · 저장 시 다시 입력':'Secret Key','secret','','password','required autocomplete="off"')}</div></section><details><summary class="cursor-interaction">고급 옵션</summary><div class="gm-grid">${field('공개 Endpoint (선택)','public',s.public||'','url','placeholder="기본: S3 Endpoint"')}</div>${check('Path-style 주소 사용','path',s.path)}${check('FileGate를 통한 강제 중계','relay',s.relay)}</details><p class="gm-error" role="alert" id="gm-error"></p><div class="gm-form-foot">${btn('취소','cancel')}<button class="gm-btn gm-primary cursor-interaction" type="submit">${icon('check')} 접근 확인 후 ${id?'저장':'등록'}</button></div></form>`;}
 function clientForm(){return heading('클라이언트 등록','서비스 연결')+`<form id="gm-form" class="gm-form" data-kind="client"><div class="gm-grid">${field('클라이언트 ID','id','','text','required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"')}<div class="gm-field"><label for="gm-storage">스토리지</label><select id="gm-storage" name="storage">${stores.map(s=>`<option value="${esc(s.id)}">${esc(s.id)} · ${esc(s.bucket)}</option>`).join('')}</select></div></div><section class="gm-form-section"><h2>초기 자격증명</h2>${check('S3 자격증명 발급','s3')}${check('기존 Native API Key 해시 등록','native')}<div id="gm-native-field" hidden>${field('SHA-256 해시','hash','','text','placeholder="sha256:…"')}</div></section><p class="gm-error" role="alert" id="gm-error"></p><div class="gm-form-foot">${btn('취소','cancel')}<button class="gm-btn gm-primary cursor-interaction" type="submit" ${stores.length?'':'disabled'}>${icon('plus')} 클라이언트 등록</button></div></form>`;}
 function main(){
  if(mode==='storage')return storageForm();if(mode==='client')return clientForm();
  if(page==='overview')return heading('Overview','Home / Production',refresh())+`<div class="gm-actions"><span class="gm-status">${icon('circle-check')} API Ready</span><span class="gm-status">${icon('circle-check')} Database Ready</span><span class="gm-muted">스토리지 실물 · 미검사</span></div><div class="gm-stats"><div><small>활성 사용량</small><div class="gm-value">${money(total('active'))}</div></div><div><small>등록 한도</small><div class="gm-value">${stores.some(s=>!s.capacity)?'무제한 포함':money(total('capacity'))}</div></div><div><small>삭제 대기</small><div class="gm-value">${money(total('purge'))}</div></div></div><section class="gm-section"><div class="gm-section-head"><h2>사용량 이력</h2><select aria-label="이력 기간" id="gm-period" style="width:auto"><option value="7" ${period==='7'?'selected':''}>최근 7일</option><option value="30" ${period==='30'?'selected':''}>최근 30일</option></select></div><div class="gm-muted">활성 용량 (GB) · 0–1,200</div><div class="gm-history" role="img" aria-label="예시 활성 용량 이력, 점진적으로 증가">${(period==='7'?[74,76,79,83,88,94,100]:[24,32,44,52,67,81,100]).map((v,i)=>`<div class="gm-bar" data-tooltip="${Math.round(1200*v/100)} GB"><span style="height:${v}%"></span></div>`).join('')}</div><div class="gm-axis"><span>${period==='7'?'6일 전':'29일 전'}</span><span>오늘</span></div></section><section class="gm-section"><div class="gm-section-head"><h2>클라이언트별 사용량</h2><span class="gm-muted">예약 ${money(total('pending'))}</span></div>${clientTable()}</section>`;
  if(page==='storages'&&!id)return heading('Storages',`${stores.length}개 등록 · 외부 S3`,refresh()+btn(icon('plus')+' 스토리지 등록','new-storage','gm-primary'))+storageTable();
  if(page==='storages'){const s=stores.find(s=>s.id===id);return `<div class="gm-crumb">${link('Storages','storages','')} / ${esc(id)}</div>`+heading(id,s.bucket,refresh()+btn(icon('pencil')+' 수정','edit-storage'))+detailList([['Endpoint',esc(s.endpoint)],['공개 Endpoint',esc(s.public||s.endpoint)],['Region',esc(s.region)],['Bucket',esc(s.bucket)],['전송',s.relay?'Relay':'Direct presigned'],['Path-style',s.path?'사용':'미사용'],['Access Key',esc(s.access)],['Secret Key','설정됨'],['사용량 / 한도',`${money(s.active)} / ${s.capacity?money(s.capacity):'무제한'}`]])+`<section class="gm-section"><div class="gm-section-head"><h2>연결된 클라이언트</h2></div>${clientTable(clients.filter(c=>c.storage===id))}</section>`+deletion();}
  if(!id)return heading('Clients',`${clients.length}개 등록`,refresh()+btn(icon('plus')+' 클라이언트 등록','new-client','gm-primary'))+clientTable();
  const c=clients.find(c=>c.id===id);return `<div class="gm-crumb">${link('Clients','clients','')} / ${esc(id)}</div>`+heading(id,c.storage,refresh())+`<div class="gm-tabs" role="tablist" aria-label="클라이언트 관리">${[['summary','Summary'],['keys','Native keys'],['creds','S3 credentials']].map(([k,v])=>`<button class="cursor-interaction" role="tab" data-tab="${k}" aria-selected="${tab===k}">${v}</button>`).join('')}</div>`+(tab==='summary'?detailList([['스토리지',link(c.storage,'storages',c.storage)],['파일',count(c.files)],['사용량',money(c.active)],['보존 메타데이터',count(c.retained)]])+deletion():`<div class="gm-section-head"><h2>${tab==='keys'?'Native API Key':'S3 자격증명'}</h2>${btn(icon('plus')+(tab==='keys'?' 해시 등록':' 자격증명 발급'),tab==='keys'?'add-key':'issue','gm-primary')}</div>${table([tab==='keys'?'키 해시':'Access Key ID','상태','관리'],c[tab].map((k,i)=>[`<span style="font-family:ui-monospace,monospace">${esc(k)}</span>`,'활성',btn(icon('trash-2')+' 폐기','revoke','',`data-index="${i}"`)]))}`);
 }
 function render(){generation++;secret=null;overlay.innerHTML='';root.style.minHeight='720px';root.style.colorScheme=theme==='system'?'light dark':theme;root.style.setProperty('--row',design.dense?'10px':'16px');
  if(page==='login')view.innerHTML=`<div class="gm-top"><span class="gm-muted">미리보기 · 테스트 값만 사용</span>${themes()}</div><div class="gm-login"><div class="gm-brand">${icon('hard-drive')} FileGate</div><h1>관리자 로그인</h1><form id="gm-form" data-kind="login">${field('관리자 토큰','token','','password','required autocomplete="off" placeholder="fgop_…"')}<button class="gm-btn gm-primary cursor-interaction" type="submit">로그인</button></form></div>`;
  else view.innerHTML=`<header class="gm-top"><div class="gm-brand">${icon('hard-drive')} FileGate <small>Console</small></div><div class="gm-actions"><span class="gm-muted gm-environment">Home / Production</span>${themes()}${btn(icon('log-out'),'logout','gm-icon','aria-label="로그아웃" data-tooltip="로그아웃"')}</div></header><div class="gm-layout"><nav aria-label="메인 메뉴">${[['overview','layout-dashboard','Overview'],['storages','database','Storages'],['clients','boxes','Clients']].map(([k,i,t])=>`<button class="cursor-interaction" data-open="${k}" ${page===k?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('')}<div class="gm-foot">admin<br>미리보기 · 예시 데이터</div></nav><main>${notice?`<div class="gm-notice" role="status">${esc(notice)}</div>`:''}${main()}</main></div>`;
  if(globalThis.lucide)lucide.createIcons();
 }
 function modal(title,body,actions){const active=document.activeElement;view.inert=true;overlay.innerHTML=`<div class="gm-modal-layer"><section class="gm-modal" role="dialog" aria-modal="true" aria-labelledby="gm-modal-title"><div class="gm-heading"><h2 id="gm-modal-title">${title}</h2>${btn(icon('x'),'close','gm-icon','aria-label="닫기"')}</div>${body}<div class="gm-form-foot">${actions}</div><div class="gm-error" role="alert" id="gm-modal-error"></div></section></div>`;overlay._returnFocus=active;globalThis.lucide?.createIcons();overlay.querySelector('input,button')?.focus();requestAnimationFrame(()=>{root.style.minHeight=Math.max(720,overlay.querySelector('.gm-modal').offsetHeight+110)+'px';});}
 function close(){overlay.innerHTML='';view.inert=false;secret=null;root.style.minHeight='720px';overlay._returnFocus?.focus();}
 function issued(c){const access='fgak_demo_'+String(++serial).padStart(4,'0');c.creds.push(access);notice='S3 자격증명을 발급했습니다.';render();view.inert=false;secret={access_key_id:access,secret_key:'demo-only-not-a-real-secret-'+serial};modal('S3 자격증명 발급',`<p class="gm-muted">${esc(c.id)} · 이번 화면에서만 표시</p><label>Access Key ID</label><div class="gm-code">${access}</div><label>Secret Key</label><div class="gm-code">${secret.secret_key}</div><div class="gm-actions">${btn(icon('copy')+' 복사','copy-secret')}${btn(icon('download')+' 다운로드','download-secret')}</div>`,btn('확인','close','gm-primary'));}
 function confirmDelete(index){const credential=Number.isInteger(index);if(!credential&&reasons().length)return;const c=clients.find(c=>c.id===id);const expected=credential?c[tab][index]:id;modal(credential?'자격증명 폐기':'등록 삭제',`<p>${credential?'선택한 자격증명의 접근 권한을 폐기합니다.':page==='storages'?'FileGate 연결 등록을 삭제합니다. 외부 버킷은 유지됩니다.':'클라이언트와 연결된 키를 삭제합니다.'}</p>${field('확인 이름','confirm','','text',`autocomplete="off" placeholder="${esc(expected)}"`)}<p class="gm-muted" style="margin-top:8px">${esc(expected)}</p>`,btn('취소','close')+btn(credential?'폐기':'삭제','confirm-delete','gm-danger','disabled'));const input=overlay.querySelector('input');const confirm=overlay.querySelector('[data-action=confirm-delete]');input.addEventListener('input',()=>confirm.disabled=input.value!==expected);confirm.onclick=()=>{if(input.value!==expected||(!credential&&reasons().length))return;if(credential)c[tab].splice(index,1);else{const list=page==='storages'?stores:clients;list.splice(list.findIndex(x=>x.id===id),1);id=null;}close();notice=credential?'자격증명을 폐기했습니다.':'등록을 삭제했습니다.';render();save();};}
 root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.type==='submit'&&b.form){e.preventDefault();const f=b.form;if(f?.reportValidity())f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}if(b.dataset.theme){theme=b.dataset.theme;root.style.colorScheme=theme==='system'?'light dark':theme;root.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.theme===theme)));save();return;}if(b.dataset.open){page=b.dataset.open;id=b.dataset.id||null;mode=null;tab='summary';notice='';view.inert=false;render();save();return;}if(b.dataset.tab){tab=b.dataset.tab;notice='';render();save();return;}switch(b.dataset.action){case'new-storage':page='storages';id=null;mode='storage';notice='';render();break;case'edit-storage':mode='storage';notice='';render();break;case'new-client':page='clients';id=null;mode='client';notice='';render();break;case'cancel':mode=null;render();break;case'logout':page='login';mode=null;render();save();break;case'refresh':notice='예시 데이터 갱신 완료';render();break;case'delete':confirmDelete();break;case'revoke':confirmDelete(Number(b.dataset.index));break;case'close':close();break;case'issue':{const c=clients.find(c=>c.id===id);modal('S3 자격증명 발급',`<p>${esc(id)}에 새 접근 키를 발급합니다.</p>`,btn('취소','close')+btn('발급','issue-confirm','gm-primary'));overlay.querySelector('[data-action=issue-confirm]').onclick=()=>{close();issued(c);};break;}case'add-key':modal('Native 키 해시 등록',field('SHA-256 해시','new-hash','','text','placeholder="sha256:…"'),btn('취소','close')+btn('등록','save-key','gm-primary'));break;case'save-key':{const value=overlay.querySelector('input').value.trim();const error=overlay.querySelector('#gm-modal-error');if(!/^sha256:[a-f0-9]{64}$/.test(value)){error.textContent='sha256: 접두사와 소문자 hex 64자를 입력하세요.';return;}if(clients.some(c=>c.keys.includes(value))){error.textContent='이미 등록된 키입니다.';return;}clients.find(c=>c.id===id).keys.push(value);close();notice='Native 키 해시를 등록했습니다.';render();break;}case'copy-secret':if(secret){try{await navigator.clipboard.writeText(JSON.stringify(secret,null,2));b.textContent='복사됨';}catch{overlay.querySelector('#gm-modal-error').textContent='브라우저에서 복사를 허용하지 않았습니다. 값을 직접 선택해 복사하세요.';}}break;case'download-secret':if(secret){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(secret,null,2)],{type:'application/json'}));a.href=url;a.download='filegate-demo-credential.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}break;}});
 root.addEventListener('change',e=>{if(e.target.name==='native'){root.querySelector('#gm-native-field').hidden=!e.target.checked;root.querySelector('[name=hash]').required=e.target.checked;}if(e.target.id==='gm-period'){period=e.target.value;render();save();}});
 root.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.getAttribute("id")!=='gm-form')return;if(!f.reportValidity())return;const data=Object.fromEntries(new FormData(f));if(f.dataset.kind==='login'){f.reset();page='overview';id=null;notice='';render();save();return;}const error=root.querySelector('#gm-error');const list=f.dataset.kind==='storage'?stores:clients;if(!id&&list.some(x=>x.id===data.id)){error.textContent='이미 등록된 ID입니다.';return;}if(['api','blobs','healthz','readyz'].includes(data.id)){error.textContent='예약된 ID입니다.';return;}if(data.native&&(!/^sha256:[a-f0-9]{64}$/.test(data.hash)||clients.some(c=>c.keys.includes(data.hash)))){error.textContent='유효하고 중복되지 않은 SHA-256 해시를 입력하세요.';return;}if(f.dataset.kind==='storage'){if(!/^https?:\/\//.test(data.endpoint)||(data.public&&!/^https?:\/\//.test(data.public))){error.textContent='HTTP 또는 HTTPS Endpoint를 입력하세요.';return;}const old=id?stores.find(s=>s.id===id):null;const entry={id:data.id,endpoint:data.endpoint,bucket:data.bucket,region:data.region,access:data.access,public:data.public,capacity:Number(data.capacity),path:!!data.path,relay:!!data.relay,...(old?{active:old.active,pending:old.pending,purge:old.purge,files:old.files}:{active:0,pending:0,purge:0,files:0})};f.querySelector('[name=secret]').value='';delete data.secret;const submit=f.querySelector('[type=submit]');submit.disabled=true;submit.textContent='접근 확인 중…';const current=generation;setTimeout(()=>{if(current!==generation)return;if(old)Object.assign(old,entry);else stores.push(entry);id=entry.id;mode=null;notice='등록 정보를 저장했습니다. (예시 동작)';render();save();},500);}else{const c={id:data.id,storage:data.storage,files:0,active:0,retained:0,keys:data.native?[data.hash]:[],creds:[]};clients.push(c);id=c.id;mode=null;tab='summary';notice='클라이언트를 등록했습니다.';render();save();if(data.s3)issued(c);}});
 root.addEventListener('keydown',e=>{if(!overlay.children.length)return;if(e.key==='Escape'){close();return;}if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button:not(:disabled),input,a[href]')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 function restore(s){if(['light','dark','system'].includes(s?.modelContent?.theme))theme=s.modelContent.theme;if(['overview','storages','clients','login'].includes(s?.modelContent?.screen))page=s.modelContent.screen;const candidate=s?.privateContent?.id;id=(page==='storages'?stores:clients).some(x=>x.id===candidate)?candidate:null;if(['summary','keys','creds'].includes(s?.privateContent?.tab))tab=s.privateContent.tab;mode=null;view.inert=false;render();}
 restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
 if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>root.style.setProperty('--row',design.dense?'10px':'16px')});t.addToggle(design,'dense',{label:'조밀한 목록'});}
})();
</script>
</div>
